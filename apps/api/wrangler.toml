name = "kaoud-hotel-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://kaoud-hotel.pages.dev"
# Comma-separated extra origins (Pages previews / custom domains) go here.
APP_ORIGIN_EXTRA = ""

[[d1_databases]]
binding = "DB"
database_name = "kaoud_hotel"
# Replaced by scripts/setup.sh after `wrangler d1 create`.
database_id = "PLACEHOLDER"

[observability]
enabled = true
