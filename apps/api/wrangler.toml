name = "kaoud-hotel-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://kaoud-hotel.pages.dev"
# Comma-separated extra origins (Pages previews / custom domains) go here.
APP_ORIGIN_EXTRA = ""
# Extra desktop-shell origins beyond the built-in defaults
# (http://tauri.localhost, app://kaoud).
DESKTOP_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "kaoud_hotel"
database_id = "97127178-19ac-4cbf-a52e-30d20538b680"

[observability]
enabled = true
